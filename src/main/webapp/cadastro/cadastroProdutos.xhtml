<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">


    <ui:define name="title"> Cadastro de Produtos </ui:define>

    <ui:define name="content">
        <h:form id="formCadastro">
            <p:messages id="msgs" showDetail="true" closable="true" />

            <p:panel header="Gerenciar Produto">
                <p:panelGrid columns="2" columnClasses="label, value" style="width:100%">

                    <p:outputLabel for="nome" value="Nome do Produto" />
                    <p:inputText id="nome" value="#{cadastroProdutoBean.produtoVO.nomeProduto}" required="true" requiredMessage="Nome é obrigatório"  style="width:100%"/>

                    <p:outputLabel for="qtd" value="Quantidade" />
                    <p:spinner id="qtd" value="#{cadastroProdutoBean.produtoVO.quantidade}" required="true" requiredMessage="Quantidade é obrigatória" />

                    <p:outputLabel for="valor" value="Valor: " />
                    <p:inputText id="valor" value="#{cadastroProdutoBean.produtoVO.preco}" required="true" requiredMessage="valor é obrigatório"  style="width:100%"/>

                    <p:outputLabel for="estoque" value="Em estoque? " />
                    <p:selectBooleanCheckbox id="estoque" value="#{cadastroProdutoBean.produtoVO.emEstoque}" />

                </p:panelGrid>

                <p:separator/>

                <p:commandButton
                        value="Limpar"
                        action="#{cadastroProdutoBean.limparCampos}"
                        update="@form"
                        process="@this"
                        icon="pi pi-refresh"
                        />

                <p:commandButton
                        value="Salvar"
                        action="#{cadastroProdutoBean.cadastrarProduto}"
                        update="@form :tabelaProdutos"
                        icon="pi pi-check"
                        />
            </p:panel>
        </h:form>

        <div style="flex: 2; margin-top: 20px;">
            <h:form id="tabelaProdutos">
                <p:panel header="Tabela de Produtos" style="width:100%">

                    <p:dataTable value="#{cadastroProdutoBean.produtos}" var="produto"
                                emptyMessage="Nenhum produto cadastrado"
                                paginator="true" rows="5">

                        <p:column headerText="Nome">
                            <h:outputText value="#{produto.nomeProduto}" />
                        </p:column>

                        <p:column headerText="Quantidade">
                            <h:outputText value="#{produto.quantidade}" />
                        </p:column>

                        <p:column headerText="Preço">
                            <h:outputText value="#{produto.preco}">
                                <f:convertNumber type="currency" currencySimbol="R$" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Estoque">
                            <h:outputText value="#{produto.emEstoque ? 'Sim' : 'Não'}" />
                        </p:column>

                        <p:column headerText="Ações" style="text-align:center;" >
                                  <p:commandButton
                                            icon="pi pi-pencil"
                                            action="#{cadastroProdutoBean.prepararEdicao(produto)}"
                                            update=":formCadastro"
                                                />

                                <p:commandButton
                                        icon="pi pi-trash"
                                        action="#{cadastroProdutoBean.excluirProduto(produto)}"
                                        update=":tabelaProdutos :formCadastro:msgs"
                                />
                        </p:column>
                    </p:dataTable>
                </p:panel>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" >
                        <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat" />
                        <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" />
                </p:confirmDialog>

            </h:form>
        </div>
    </ui:define>
</ui:composition>
